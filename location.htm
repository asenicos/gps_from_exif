	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
	<style>
        #map {
            height: 100vh; /* Высота карты на весь экран */
            width: 100%; /* Ширина карты на весь экран */
        }
		#coordinates {
            position: absolute;
            bottom: 3%;
            left: 92%;
            background: rgba(255, 255, 255, 0.7); /* Полупрозрачный фон */
            padding: 5px;
            border-radius: 5px;
            z-index: 1000;
        }
		
		

		.photo-marker .thumb {
			width: 60px;
			height: 60px;
			background-size: cover;       /* ← работает с любым соотношением */
			background-position: center;
			background-repeat: no-repeat;
			border-radius: 6px;
			border: 2px solid white;
			box-shadow: 0 0 8px rgba(0,0,0,0.4);
		}


		.photo-marker img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			pointer-events: none; /* чтобы событие клика ловил маркер */
		}
    </style>

<body>
    <div id="map"></div>
	<div id="coordinates"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>


	<!-- Кластер -->
	<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
	<script src="gps_markers.js"></script>




<script>
function showImageOverlay(url) {
    // Удаляем старое окно, если есть
    const old = document.getElementById('img-overlay');
    if (old) old.remove();

    // Фон
    const overlay = document.createElement('div');
    overlay.id = 'img-overlay';
    overlay.style = `
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: zoom-out;
        overflow: hidden;
    `;

    // Контейнер для картинки (чтобы было удобнее двигать)
    const imgWrap = document.createElement('div');
    imgWrap.style = `
        cursor: grab;
        display: inline-block;
        transform-origin: center;
        transition: transform 0.1s;
    `;

    // Изображение
    const img = document.createElement('img');
    img.src = url;
    img.style = `
        max-width: 90vw;
        max-height: 90vh;
        pointer-events: none;
        user-select: none;
    `;

    imgWrap.appendChild(img);
    overlay.appendChild(imgWrap);
    document.body.appendChild(overlay);

    // -----------------------
    // Масштабирование колесом
    // -----------------------
    let scale = 1;
    overlay.addEventListener('wheel', e => {
        e.preventDefault();
        if (e.deltaY < 0) scale *= 1.1;
        else scale /= 1.1;

        imgWrap.style.transform = `scale(${scale}) translate(${offsetX}px, ${offsetY}px)`;
    });

    // -----------------------
    // Перемещение мышью
    // -----------------------
    let isDown = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;

    const onPointerDown = e => {
        if (scale <= 1) return; // если не увеличено — не двигаем

        isDown = true;
        imgWrap.style.cursor = "grabbing";

        startX = e.clientX;
        startY = e.clientY;
    };

    const onPointerMove = e => {
        if (!isDown) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        offsetX += dx / scale;
        offsetY += dy / scale;

        imgWrap.style.transform = `scale(${scale}) translate(${offsetX}px, ${offsetY}px)`;

        startX = e.clientX;
        startY = e.clientY;
    };

    const onPointerUp = () => {
        isDown = false;
        imgWrap.style.cursor = "grab";
    };

    imgWrap.addEventListener("mousedown", onPointerDown);
    imgWrap.addEventListener("mousemove", onPointerMove);
    imgWrap.addEventListener("mouseup", onPointerUp);
    imgWrap.addEventListener("mouseleave", onPointerUp);

    // Touch (мобильные)
    imgWrap.addEventListener("touchstart", e => onPointerDown(e.touches[0]));
    imgWrap.addEventListener("touchmove", e => { onPointerMove(e.touches[0]); e.preventDefault(); });
    imgWrap.addEventListener("touchend", onPointerUp);

    // -----------------------
    // Закрытие по клику вне картинки
    // -----------------------
    overlay.addEventListener('click', e => {
        if (e.target === overlay) overlay.remove();
    });

    // -----------------------
    // Закрытие по ESC
    // -----------------------
    const escListener = e => {
        if (e.key === 'Escape') {
            overlay.remove();
            document.removeEventListener('keydown', escListener);
        }
    };
    document.addEventListener('keydown', escListener);
}
</script>



    <script>
        // Создание карты и установка начальной позиции и уровня зума
        var map = L.map('map').setView([55.7558, 37.6173], 3); // Координаты Москвы

        // Добавление слоя с картой OSM
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
				

		var markers = L.markerClusterGroup();


		// Делаем кастомную иконку с превью
		function createPhotoMarker(lat, lng, thumbUrl, fullUrl) {

			const icon = L.divIcon({
				className: "photo-marker",
				html: '<div class="thumb" style="background-image:url('+thumbUrl+')"></div>',
				iconSize: [60, 60],
				iconAnchor: [30, 30]
			});

			const marker = L.marker([lat, lng], { icon });

			// Важно: ставим обработчик на сам маркер
			marker.on("click", () => {
				showImageOverlay(fullUrl);
			});

			return marker;
		}

		locations.forEach(function(loc) {
			const url = loc[2]
			const fileName = url.split('/').pop();
			const fullPath = url.substring(0, url.lastIndexOf('/'));
			const url_preview = fullPath + '/tn/' + fileName;

			markers.addLayer( createPhotoMarker( loc[0], loc[1], url_preview, url ) );

		});

		// добавляем кластер на карту
		map.addLayer(markers);


    </script>
</body>
</html>
